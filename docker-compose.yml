#    container_name: watchtower
#    restart: unless-stopped
#    volumes:
#      - /var/run/docker.sock:/var/run/docker.sock
#    command: --interval 300 --cleanup azure-ddns

secrets:
  ddns_azure_tenant_id:
    file: ./secrets/ddns_azure_tenant_id
  ddns_azure_client_id:
    file: ./secrets/ddns_azure_client_id
  ddns_azure_client_secret:
    file: ./secrets/ddns_azure_client_secret